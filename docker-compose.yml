# Legal Lens - Local Docker Compose
#
# Phase 4 (docs/PRODUCTION_READINESS_PRD.md): backend + worker share the
# same image and code, and both read REDIS_URL to talk to the redis
# service. Without REDIS_URL set, the backend falls back to running
# OCR/rule-evaluation inline (see backend/app/workers/celery_app.py) -
# so `docker compose up backend` alone still works standalone if you
# don't need background processing.
#
# Phase 5: backend + worker also read DATABASE_URL to talk to the
# postgres service. Without it, both fall back to the SQLite file
# (see backend/app/core/config.py) - same zero-setup story for local
# dev. Run `docker compose exec backend alembic upgrade head` once
# after the postgres service is first up to create the schema.
#
# Phase 6: backend + worker also read S3_BUCKET/S3_ENDPOINT_URL to
# store uploaded images and generated PDF reports in the minio service
# instead of local disk (see backend/app/services/storage.py). Without
# S3_BUCKET set, both fall back to local disk under ./storage - same
# zero-setup story again. The bucket itself isn't auto-created; run
# `docker compose exec backend python -c "from app.services.storage import storage; storage.client.create_bucket(Bucket='legallens')"`
# once after minio is first up (or create it via the MinIO console at
# http://localhost:9001, default credentials minioadmin/minioadmin).
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=legallens
      - POSTGRES_PASSWORD=legallens
      - POSTGRES_DB=legallens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://legallens:legallens@postgres:5432/legallens
      - S3_BUCKET=legallens
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
      - postgres
      - minio
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    working_dir: /app/backend
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://legallens:legallens@postgres:5432/legallens
      - S3_BUCKET=legallens
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
      - postgres
      - minio
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
